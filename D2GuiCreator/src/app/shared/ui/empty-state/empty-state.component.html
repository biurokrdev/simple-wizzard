<div class="empty-state" [class.empty-state--error]="tone === 'error'" [class.empty-state--section]="size === 'section'">
  <div class="empty-state__icon" aria-hidden="true">
    @switch (icon) {
      @case ('folder') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.3a1.5 1.5 0 0 1 1.06.44L11.5 7.5h8A1.5 1.5 0 0 1 21 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-10z"/>
          <path d="M3 11h18"/>
        </svg>
      }
      @case ('search') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.8-3.8"/>
        </svg>
      }
      @case ('error') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5 2.8 19.2A1.5 1.5 0 0 0 4.1 21.5h15.8a1.5 1.5 0 0 0 1.3-2.3L12 3.5z"/>
          <path d="M12 10v4.5"/>
          <circle cx="12" cy="17.6" r=".6" fill="currentColor"/>
        </svg>
      }
      @case ('inbox') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 13.5V17a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"/>
          <path d="M4 13.5 6.2 6.7A1.5 1.5 0 0 1 7.6 5.7h8.8a1.5 1.5 0 0 1 1.4 1L20 13.5"/>
          <path d="M4 13.5h4.5l1 2h5l1-2H20"/>
        </svg>
      }
      @case ('users') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9.5" cy="8.5" r="3.2"/>
          <path d="M3.5 19.5a6 6 0 0 1 12 0"/>
          <circle cx="17" cy="9.5" r="2.4"/>
          <path d="M16.5 15.2a4.5 4.5 0 0 1 4 4.3"/>
        </svg>
      }
      @case ('check') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="m8.5 12.3 2.4 2.4 4.8-5"/>
        </svg>
      }
    }
  </div>

  <h2 class="empty-state__title">{{ title }}</h2>

  @if (description || message) {
    <p class="empty-state__description">
      {{ description || message }}
    </p>
  }

  <div class="empty-state__actions">
    @if (actionLabel) {
      <app-button
        [variant]="'primary'"
        (clicked)="onActionClick()">
        {{ actionLabel }}
      </app-button>
    }
    <ng-content></ng-content>
  </div>
</div>
